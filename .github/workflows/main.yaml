name: Auto-build HTML files

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - working
  schedule:
      - cron: '10 1 * * *'  # Runs (supposedly) at 1:10 AM every day
    #  - cron: '35 6 * * *'  # Runs (supposedly) at 6:35 AM every day

jobs:
  call-build-site:
    uses: comic-git/comic_git_engine/.github/workflows/build_site.yaml@v1
